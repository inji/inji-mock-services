spring.application.name=inji-student-usecase
server.port=8085

# PostgreSQL DataSource
# Default for local dev (docker-compose-injistack PostgreSQL on port 5433)
# Override via environment variables in Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/inji_certify?currentSchema=certify
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - point to certify schema in inji_certify DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=certify
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.mosip=DEBUG
logging.level.org.springframework.web=INFO

# Certify endpoint (used by CredentialOfferService)
certify.pre-auth-endpoint=http://host.docker.internal:8091/v1/certify/pre-authorized-data
