## ------------------------------------------- Postgres Data Provider Plugin properties (Student Usecase) ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Plugin mode & data provider ------------------------------------------------------------
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin

mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.mock.authenticator.get-identity-url=http://mock-identity-system:8082/v1/mock-identity-system/identity
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=${mosip.certify.domain.url}

#expose certify-nginx through a tunnel like ngrok to expose https url and configure here
mosip.certify.data-provider-plugin.did-url=did:web:localhost:8091
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## ------------------------------------------- Scope-to-Query Mapping (Postgres) ------------------------------------------------------------
## Maps the credential scope to a SQL query that joins students + graduation details
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
    'student_graduation_vc_ldp': 'SELECT s.student_id, s.full_name, s.email, s.phone_number, s.date_of_birth, s.course_program, s.enrollment_date, s.academic_year, s.cgpa, g.registration_number, g.degree_title, g.graduation_month, g.graduation_year, g.classification, g.certificate_status FROM certify.students s JOIN certify.student_graduation_details g ON s.id = g.student_id WHERE s.student_id = :id OR (:id LIKE ''{%}'' AND s.student_id = jsonb_extract_path_text(cast(:id as jsonb), ''studentId''))'\
}

## ------------------------------------------- Issuer Display ------------------------------------------------------------
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'University Student Certification Authority',\
    'locale': 'en'\
  }\
}

## ------------------------------------------- Rendering Template ------------------------------------------------------------
mosip.certify.data-provider-plugin.rendering-template-id=

## ------------------------------------------- Indexed Mappings (for searchability) ------------------------------------------------------------
mosip.certify.indexed-mappings.course_program=$.course_program
mosip.certify.indexed-mappings.academic_year=$.academic_year
mosip.certify.indexed-mappings.classification=$.classification
